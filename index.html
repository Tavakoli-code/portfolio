<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Sajad Ali Tavakoli — Backend Developer</title>
        <meta
            name="description"
            content="Personal portfolio of Sajad Ali Tavakoli, a backend developer focused on building reliable backend systems, APIs, databases, and production-ready software."
        />
        <meta name="author" content="Sajad Ali Tavakoli" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
            rel="stylesheet"
        />

        <script>
            try {
                if (localStorage.getItem("portfolioTheme") === "light") {
                    document.documentElement.dataset.theme = "light";
                }
            } catch {
                // Keep the default theme when storage is unavailable.
            }
        </script>
        <link rel="stylesheet" href="./style.css" />

        <link rel="preload" as="image" href="./assets/images/hero_background.png" />

        <script src="https://unpkg.com/lucide@latest"></script>
    </head>

    <body>
        <!-- Preloader -->
        <div id="preloader" aria-hidden="true">
            <div class="preloader-code">
                <span class="bracket">&lt;</span>

                <div class="preloader-dots">
                    <div class="preloader-dot"></div>
                    <div class="preloader-dot"></div>
                    <div class="preloader-dot"></div>
                </div>

                <span class="bracket">&gt;</span>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content">
            <!-- Navigation -->
            <nav id="navbar" aria-label="Main navigation">
                <a href="#hero" class="nav-logo" id="navLogo">sajad<span>.</span>dev</a>

                <ul class="nav-links" id="navLinks"></ul>

                <div class="nav-actions">
                    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light mode">
                        <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="4" />
                            <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" />
                        </svg>
                        <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" />
                        </svg>
                    </button>
                    <button class="language-toggle" id="languageToggle" type="button">دری</button>

                    <button
                        class="nav-mobile-toggle"
                        id="mobileToggle"
                        type="button"
                        aria-label="Toggle menu"
                    >
                        <i data-lucide="menu" style="width: 20px; height: 20px"></i>
                    </button>
                </div>
            </nav>

            <!-- Mobile Menu -->
            <div class="mobile-menu" id="mobileMenu"></div>

            <!-- Hero -->
            <section id="hero"></section>

            <!-- About -->
            <section id="about"></section>

            <!-- Skills -->
            <section id="skills"></section>

            <!-- Projects -->
            <section id="projects"></section>

            <!-- Experience -->
            <section id="experience"></section>

            <!-- Services -->
            <section id="services"></section>

            <!-- Current Focus -->
            <section id="focus"></section>

            <!-- Approach & Goals -->
            <section id="approach"></section>

            <!-- Contact -->
            <section id="contact"></section>

            <!-- Footer -->
            <footer id="footer"></footer>
        </div>

        <script src="./data.js"></script>
        <script src="./main.js"></script>
    </body>
</html>
